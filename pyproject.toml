[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-prompt-engineering-cli"
version = "0.1.0a5"
description = "Local installer and verifier for the Universal Prompt Engineering Agent Skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
]

[project.scripts]
upe-skill = "upe.cli:main"

[project.urls]
Repository = "https://github.com/pcdosilva01-spec/Prompt-Enginer"
Documentation = "https://github.com/pcdosilva01-spec/Prompt-Enginer#readme"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
upe = ["resources/skill/universal-prompt-engineering/*", "resources/skill/universal-prompt-engineering/**/*"]
